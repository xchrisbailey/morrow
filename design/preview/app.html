<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morrow Prototype</title>
<link rel="stylesheet" href="../index.css">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="shell-app" id="shell">
  <div class="scrim" id="scrim"></div>
  <aside class="shell-app__sidebar" id="sidebar" aria-label="Spaces and sections">
    <div class="brand"><span class="brand__mark" aria-hidden="true"></span>Morrow</div>
    <div class="switch" id="space-switch" data-active="personal" role="group" aria-label="Space">
      <span class="switch__indicator" aria-hidden="true"></span>
      <button type="button" data-space="personal" aria-pressed="true">Personal</button>
      <button type="button" data-space="work" aria-pressed="false">Work</button>
    </div>
    <nav class="nav-group" id="nav" aria-label="Sections"></nav>
    <div class="sidebar-foot stack" style="--gap: var(--space-2)">
      <button class="nav-item" type="button" id="theme-toggle"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><span>Theme: system</span></button>
      <a class="nav-item" href="index.html" style="text-decoration:none"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Design foundations</span></a>
    </div>
  </aside>

  <header class="shell-app__header">
    <button class="btn btn--ghost btn--icon nav-toggle" type="button" id="nav-toggle" aria-label="Open sidebar"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="header-title"><span class="crumb hide-sm" id="crumb">Personal</span><span class="crumb hide-sm" aria-hidden="true">/</span><h1 id="title">Home projects</h1></div>
    <div class="cluster" id="header-actions" style="--gap: var(--space-2); flex-wrap: nowrap"></div>
  </header>

  <main class="shell-app__main" id="main" style="display:flex; flex-direction:column"></main>
</div>
<script src="./app.js"></script>
</body>
</html>
