catalogMode: prefer

# One version of each shared dependency.
catalog:
  "@types/node": ^22.18.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0

  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  lucide-react: ^1.61.0

  # Drizzle v1 RC: pin exact, bump together.
  drizzle-orm: 1.0.0-rc.5
  drizzle-kit: 1.0.0-rc.5
  better-auth: 1.7.17
  "@better-auth/drizzle-adapter": 1.7.17
  "@blocknote/core": 0.57.0
  "@blocknote/react": 0.57.0
  "@blocknote/shadcn": 0.57.0
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.105.3
  "@tanstack/react-router-ssr-query": ^1.167.3
  better-sqlite3: ^13.0.3
  zod: ^4.6.7
  "@types/better-sqlite3": ^9.6.0

overrides:
  vite@*: "catalog:"
  # One Drizzle everywhere (better-auth and nitro pull it in as an optional peer).
  drizzle-orm: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# Dependencies allowed to run install scripts.
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  better-sqlite3: true
minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.17"
  - "@better-auth/drizzle-adapter@1.7.17"
  - "@better-auth/kysely-adapter@1.7.17"
  - "@better-auth/memory-adapter@1.7.17"
  - "@better-auth/mongo-adapter@1.7.17"
  - "@better-auth/prisma-adapter@1.7.17"
  - "@better-auth/telemetry@1.7.17"
  - better-auth@1.7.17
