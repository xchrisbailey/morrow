catalogMode: prefer

# One version of each shared dependency.
catalog:
  "@types/node": ^22.18.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0

  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  lucide-react: ^1.61.0

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# Dependencies allowed to run install scripts.
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
